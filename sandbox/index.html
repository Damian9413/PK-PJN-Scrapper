<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Katalog produktów</title>
</head>
<body>
    <h1>Katalog produktów</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Manufacturer</th>
            </tr>
        </thead>
        <tbody>
            <tr class="product" data-id="1">
                <td class="name">Loudspeaker</td>
                <td class="price">133,94 zł</td>
                <td class="manufacturer">JBL</td>
            </tr>
        </tbody>
    </table>
    <article class="product" data-id="2">
        <h2 class="name">Speaker</h2>
        <span class="price">100.25 zł</span>
        <p class="manufacturer">Sony</p>
    </article>

</body>
</html>
