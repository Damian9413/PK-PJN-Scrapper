<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Katalog produktów</title>
</head>
<body>
    <h1>Katalog produktów</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Manufacturer</th>
            </tr>
        </thead>
        <tbody>
            {% for product in table_products %}
            <tr class="product" data-id="{{ product.id }}">
                <td class="name">{{ product.name }}</td>
                <td class="price">{{ product.price }} zł</td>
                <td class="manufacturer">{{ product.manufacturer }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% for product in card_products %}
    <article class="product" data-id="{{ product.id }}">
        <h2 class="name">{{ product.name }}</h2>
        <span class="price">{{ product.price }} zł</span>
        <p class="manufacturer">{{ product.manufacturer }}</p>
    </article>
    {% endfor %}
</body>
</html>
